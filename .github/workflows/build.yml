name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Extrair projeto
        run: |
          echo "" | base64 -d > projeto.zip
          unzip -q projeto.zip
      - name: Compilar APK
        working-directory: DynamicNotch
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-APK
          path: DynamicNotch/app/build/outputs/apk/debug/*.apk
