name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Extrair projeto
        run: |
          echo "" | base64 -d > projeto.zip
          unzip -q projeto.zip
      - name: Preparar chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PW="${KS_PW:-$(openssl rand -hex 12)}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$HOME/release.jks"
          else
            keytool -genkeypair -keystore "$HOME/release.jks" -alias notch -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PW" -keypass "$PW" -dname "CN=Dynamic Notch"
          fi
          echo "KEYSTORE_FILE=$HOME/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=notch" >> "$GITHUB_ENV"
      - name: Compilar APK (release, assinado)
        working-directory: DynamicNotch
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-APK
          path: DynamicNotch/app/build/outputs/apk/release/*.apk
